name: Update Latest Blog Posts

on:
  schedule:
    - cron: '15 6 * * *' # Daily 06:15 UTC, away from the activity workflow's :00/:30 runs
  workflow_dispatch: # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  blog-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update README with latest blog posts
        run: node .github/scripts/blog-posts.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update latest blog posts"
          # The activity workflow also commits README.md every 30 minutes:
          # take its latest commit first, retry if a push still races it.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed, retrying ($i/3)"
            sleep 5
          done
          exit 1
